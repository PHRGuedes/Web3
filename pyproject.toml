[tool.poetry]
name = "sistema-engenharia-requisitos"
version = "0.1.0"
description = "Sistema de Engenharia de Requisitos baseado em FastAPI, SQLAlchemy e PostgreSQL"
authors = ["Desenvolvedor <desenvolvedor@exemplo.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pydantic = "^2.6.4"
email-validator = "^2.1.0"
pydantic-settings = "^2.2.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
bcrypt = "4.0.1"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
